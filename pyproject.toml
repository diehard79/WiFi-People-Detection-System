[tool.poetry]
name = "wifi-people-detection"
version = "0.1.0"
description = "WiFi-based people detection system"
authors = ["vinns"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
scikit-learn = "^1.3.0"
numpy = "^1.26.0"
pandas = "^2.1.0"
scipy = "^1.11.0"
influxdb-client = "^1.38.0"
asyncpg = "^0.29.0"
redis = "^5.0.0"
pydantic = "^2.5.0"
websockets = "^12.0"
python-socketio = {extras = ["asyncio-client"], version = "^5.10.0"}
aiohttp = "^3.9.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
apscheduler = "^3.10.0"
tenacity = "^8.2.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"
black = "^23.11.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
