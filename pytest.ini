[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    asyncio: Async tests
    integration: Integration tests (may require hardware)
    slow: Slow-running tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
