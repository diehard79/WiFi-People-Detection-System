version: '3.8'

services:
  # Main WiFi Detection Service
  wifi-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifi-detection-service
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO

      # People Detection Configuration
      - NUM_DETECTOR=4
      - UPDATE_INTERVAL=1.0

      # Wall Detection Configuration
      - ENABLE_WALL_DETECTION=true
      - WALL_NUM_DETECTORS=4
      - WALL_SAMPLING_RATE=10
      - WALL_CALIBRATION_TIME=300
      - WALL_DETECTION_DURATION=30

      # Model Configuration
      - MODEL_DIR=/app/models
      - WALL_MODEL_DIR=/app/models/wall_detection

      # Output Configuration
      - OUTPUT_DIR=/app/output
      - VISUALIZATION_DIR=/app/output/visualizations

      # Performance Configuration
      - MAX_DETECTION_TIME=30
      - MIN_CONFIDENCE=0.70
      - MAX_MEMORY_MB=500

    volumes:
      # Model storage
      - ./models:/app/models

      # Wall detection outputs
      - ./wall_detection_output:/app/output

      # CSI data storage
      - ./csi_data:/app/csi_data

      # Logs
      - ./logs:/app/logs

      # Configuration
      - ./config:/app/config

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - wifi-detection-network

  # Redis (for caching and job queue)
  redis:
    image: redis:7-alpine
    container_name: wifi-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - wifi-detection-network

  # PostgreSQL (for storing detection history)
  postgres:
    image: postgres:15-alpine
    container_name: wifi-detection-postgres
    environment:
      - POSTGRES_DB=wifi_detection
      - POSTGRES_USER=wifi_user
      - POSTGRES_PASSWORD=wifi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - wifi-detection-network

  # Prometheus (for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: wifi-detection-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - wifi-detection-network

  # Grafana (for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: wifi-detection-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    networks:
      - wifi-detection-network

networks:
  wifi-detection-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
